<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f0f2f5;
    min-height: 100vh;
    padding: 16px;
  }

  h2 {
    color: #075e54;
    font-weight: 600;
    font-size: 18px;
    margin-bottom: 14px;
    padding-left: 4px;
  }

  .status-section {
    background: #fff;
    border-radius: 12px;
    padding: 20px 22px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    margin-bottom: 28px;
  }

  /* --- Status grid (Others' Status) --- */
  .status-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }

  .status-card {
    text-align: center;
    text-decoration: none;
    color: inherit;
    display: inline-block;
    width: 90px;
    transition: transform 0.25s;
  }

  .status-card:hover { transform: scale(1.05); }

  .status-card img {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #25d366;
    display: block;
    margin: 0 auto;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .status-user {
    margin-top: 8px;
    font-weight: 600;
    font-size: 13px;
    color: #222;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90px;
  }

  .status-caption {
    font-size: 12px;
    color: #777;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90px;
  }

  /* --- My Status items --- */
  .my-status-item {
    margin-bottom: 24px;
    padding-bottom: 24px;
    border-bottom: 0.5px solid #eee;
  }

  .my-status-item:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .my-status-inner {
    display: flex;
    gap: 18px;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  /* --- Viewer block --- */
  .viewer-block { flex: 1; min-width: 180px; }

  .viewer-label {
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .viewer-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .viewer-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #333;
  }

  .viewer-list li img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: none;
    box-shadow: none;
  }

  .avatar-fallback {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: #888;
    flex-shrink: 0;
  }

  .no-viewers {
    font-size: 12px;
    color: #aaa;
    font-style: italic;
    margin-top: 4px;
  }

  .no-status {
    font-style: italic;
    color: #aaa;
    text-align: center;
    padding: 14px 0;
    font-size: 14px;
  }

  /* =====================
     RESPONSIVE BREAKPOINTS
  ===================== */

  /* Mobile - small */
  @media (max-width: 360px) {
    body { padding: 8px; }
    .status-section { padding: 12px 12px; }
    .status-card { width: 68px; }
    .status-card img { width: 56px; height: 56px; }
    .status-user, .status-caption { max-width: 68px; }
    .status-grid { gap: 8px; }
    h2 { font-size: 15px; }
  }

  /* Mobile - standard */
  @media (min-width: 361px) and (max-width: 480px) {
    body { padding: 10px; }
    .status-section { padding: 14px 14px; }
    .status-card { width: 78px; }
    .status-card img { width: 64px; height: 64px; }
    .status-user, .status-caption { max-width: 78px; }
    .status-grid { gap: 10px; }
    h2 { font-size: 16px; }
  }

  /* Tablet */
  @media (min-width: 481px) and (max-width: 767px) {
    body { padding: 14px; }
    .status-card { width: 85px; }
    .status-card img { width: 70px; height: 70px; }
    .status-user, .status-caption { max-width: 85px; }
  }

  /* Desktop */
  @media (min-width: 768px) {
    body { padding: 32px; max-width: 820px; margin: 0 auto; }
    .status-card { width: 100px; }
    .status-card img { width: 82px; height: 82px; }
    .status-user, .status-caption { max-width: 100px; }
    .status-grid { gap: 18px; }
    h2 { font-size: 20px; }
  }

  /* Large desktop */
  @media (min-width: 1200px) {
    body { max-width: 960px; }
  }
</style>
</head>
<body>

<!-- ===== MY STATUS ===== -->
<div class="status-section">
  <h2>My Status</h2>

  <!-- Loop: {% for status in my_statuses %} -->
  <div class="my-status-item">
    <div class="my-status-inner">

      <!-- Replace href with: {% url 'view_single_status' status.id %} -->
      <!-- Replace img src with: {{ status.image.url }} -->
      <a href="#" class="status-card">
        <img src="https://i.pravatar.cc/150?img=12" alt="My Status">
        <div class="status-user">Me</div>
        <!-- Replace with: {{ status.caption|default:"No Caption" }} -->
        <div class="status-caption">Enjoying weekend!</div>
      </a>

      <div class="viewer-block">
        <div class="viewer-label">
          <span style="font-size:15px;">👀</span> Viewed by:
        </div>

        <!-- {% if status.viewers.all %} -->
        <ul class="viewer-list">
          <!-- {% for viewer in status.viewers.all %} -->

          <!-- Viewer with profile picture -->
          <!-- {% if viewer.profile_picture %} -->
          <li>
            <!-- Replace src with: {{ viewer.profile_picture.url }} -->
            <img src="https://i.pravatar.cc/150?img=5" alt="Ali Hassan">
            <!-- Replace with: {{ viewer.username }} -->
            <span>Ali Hassan</span>
          </li>

          <li>
            <img src="https://i.pravatar.cc/150?img=8" alt="Sara Malik">
            <span>Sara Malik</span>
          </li>

          <!-- Viewer without profile picture (fallback initials) -->
          <!-- {% else %} -->
          <li>
            <div class="avatar-fallback">ZA</div>
            <span>Zain Ahmed</span>
          </li>
          <!-- {% endif %} -->

          <!-- {% endfor %} -->
        </ul>
        <!-- {% else %} -->
        <!-- <p class="no-viewers">No one has viewed this yet.</p> -->
        <!-- {% endif %} -->
      </div>

    </div>
  </div>

  <!-- Second status item (no viewers) -->
  <div class="my-status-item">
    <div class="my-status-inner">
      <a href="#" class="status-card">
        <img src="https://i.pravatar.cc/150?img=15" alt="My Status">
        <div class="status-user">Me</div>
        <div class="status-caption">No Caption</div>
      </a>
      <div class="viewer-block">
        <div class="viewer-label">
          <span style="font-size:15px;">👀</span> Viewed by:
        </div>
        <p class="no-viewers">No one has viewed this yet.</p>
      </div>
    </div>
  </div>
  <!-- {% endfor %} -->

  <!-- {% empty %} -->
  <!-- <p class="no-status">You have no active status.</p> -->
  <!-- {% endif %} -->

</div>


<!-- ===== OTHERS' STATUS ===== -->
<div class="status-section">
  <h2>Others' Status</h2>

  <!-- {% if statuses %} -->
  <div class="status-grid">

    <!-- {% for status in statuses %} -->
    <!-- Replace href with: {% url 'view_single_status' status.id %} -->
    <!-- Replace img src with: {{ status.image.url }} -->
    <!-- Replace title with: {{ status.caption|default:'No caption' }} -->

    <a href="#" class="status-card" title="Lahore trip was amazing">
      <img src="https://i.pravatar.cc/150?img=20" alt="Ahmad">
      <div class="status-user">Ahmad</div>
      <div class="status-caption">Lahore trip was...</div>
    </a>

    <a href="#" class="status-card" title="New recipe tried!">
      <img src="https://i.pravatar.cc/150?img=25" alt="Fatima">
      <div class="status-user">Fatima</div>
      <div class="status-caption">New recipe tried!</div>
    </a>

    <a href="#" class="status-card" title="Morning walk vibes">
      <img src="https://i.pravatar.cc/150?img=32" alt="Usman">
      <div class="status-user">Usman</div>
      <div class="status-caption">Morning walk vib...</div>
    </a>

    <a href="#" class="status-card" title="Coding all night">
      <img src="https://i.pravatar.cc/150?img=44" alt="Ayesha">
      <div class="status-user">Ayesha</div>
      <div class="status-caption">Coding all night</div>
    </a>

    <a href="#" class="status-card" title="Book of the month">
      <img src="https://i.pravatar.cc/150?img=50" alt="Bilal">
      <div class="status-user">Bilal</div>
      <div class="status-caption">Book of the month</div>
    </a>

    <!-- {% endfor %} -->

  </div>
  <!-- {% else %} -->
  <!-- <p class="no-status">No statuses found.</p> -->
  <!-- {% endif %} -->

</div>

</body>
</html>
