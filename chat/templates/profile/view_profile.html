{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-8 bg-gray-50 dark:bg-gray-950">
  <div class="w-full max-w-md bg-white dark:bg-gray-900 p-6 sm:p-8 rounded-3xl shadow-lg border border-gray-200 dark:border-gray-800 transition-all duration-300">
    <div class="flex flex-col items-center text-center">

      <!-- Profile Picture -->
      <div class="relative w-24 h-24 sm:w-32 sm:h-32 mb-5">
        <img src="{{ other_user.profile_picture.url }}" alt="Profile Picture"
             class="w-full h-full rounded-full border-4 border-white dark:border-gray-700 shadow-md object-cover ring-2 ring-offset-2 ring-blue-500">
      </div>

      <!-- Name -->
      <h2 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white break-words w-full">
        {{ other_user.username }}
      </h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">User Profile</p>

      <!-- Info -->
      <div class="w-full mt-6 text-left space-y-4 bg-gray-50 dark:bg-gray-800 rounded-2xl p-4">
        <div class="flex flex-col sm:flex-row sm:items-center gap-1">
          <span class="font-semibold text-gray-700 dark:text-gray-300 shrink-0">Username:</span>
          <span class="text-gray-800 dark:text-gray-200 break-words">{{ other_user.username }}</span>
        </div>
        <div class="flex flex-col sm:flex-row sm:items-start gap-1">
          <span class="font-semibold text-gray-700 dark:text-gray-300 shrink-0">About:</span>
          <span class="text-gray-800 dark:text-gray-200 break-words">
            {% if other_user.about %}
              {{ other_user.about }}
            {% else %}
              <span class="italic text-gray-400">No bio added.</span>
            {% endif %}
          </span>
        </div>
      </div>

      <!-- Message Button -->
      <a href="{% url 'chat_detail' other_user.id %}"
         class="mt-8 w-full sm:w-auto px-8 py-3 bg-gradient-to-r from-blue-500 to-blue-700 text-white font-semibold rounded-full shadow-md hover:shadow-lg hover:from-blue-600 hover:to-blue-800 transition text-center text-base">
        💬 Message {{ other_user.username }}
      </a>

    </div>
  </div>
</div>
{% endblock %}
