<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{ other_user.username }} - Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .profile-card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
      border: 1px solid #e5e7eb;
      width: 100%;
      max-width: 440px;
      padding: 36px 28px 32px;
    }

    .avatar-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 2px 12px rgba(59,130,246,0.18);
      outline: 3px solid #3b82f6;
      outline-offset: 3px;
    }
    .online-dot {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 16px;
      height: 16px;
      background: #22c55e;
      border-radius: 50%;
      border: 3px solid #fff;
    }

    .profile-name {
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      font-weight: 700;
      color: #111827;
      text-align: center;
      word-break: break-word;
      margin-bottom: 4px;
    }
    .profile-label {
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      margin-bottom: 24px;
    }

    .info-box {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px 18px;
      width: 100%;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .info-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .info-icon i {
      font-size: 14px;
      color: #3b82f6;
    }
    .info-content { min-width: 0; }
    .info-content .label {
      font-size: 11px;
      color: #9ca3af;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 1px;
    }
    .info-content .value {
      font-size: 14px;
      color: #1f2937;
      word-break: break-word;
      line-height: 1.4;
    }
    .info-content .value.muted {
      color: #9ca3af;
      font-style: italic;
    }

    .divider {
      height: 1px;
      background: #e5e7eb;
      width: 100%;
      margin-bottom: 24px;
    }

    .msg-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 24px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border-radius: 50px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 4px 14px rgba(59,130,246,0.35);
    }
    .msg-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59,130,246,0.45);
      color: #fff;
    }
    .msg-btn:active { transform: scale(0.98); }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
      font-size: 13px;
      color: #6b7280;
      text-decoration: none;
    }
    .back-link:hover { color: #3b82f6; }

    @media (max-width: 480px) {
      .profile-card { padding: 28px 18px 24px; border-radius: 20px; }
      .avatar-wrap { width: 90px; height: 90px; }
    }
  </style>
</head>
<body>

  <div class="profile-card">

    <!-- Avatar -->
    <div class="avatar-wrap">
      {% if other_user.profile_picture %}
        <img src="{{ other_user.profile_picture.url }}" alt="{{ other_user.username }}">
      {% else %}
        <img src="https://ui-avatars.com/api/?name={{ other_user.username }}&background=3b82f6&color=fff&size=128" alt="{{ other_user.username }}">
      {% endif %}
      <span class="online-dot"></span>
    </div>

    <!-- Name -->
    <div class="profile-name">{{ other_user.username }}</div>
    <div class="profile-label"><i class="fas fa-user" style="font-size:11px;margin-right:4px;"></i>User Profile</div>

    <!-- Info Box -->
    <div class="info-box">
      <div class="info-row">
        <div class="info-icon"><i class="fas fa-at"></i></div>
        <div class="info-content">
          <div class="label">Username</div>
          <div class="value">{{ other_user.username }}</div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon"><i class="fas fa-info-circle"></i></div>
        <div class="info-content">
          <div class="label">About</div>
          <div class="value {% if not other_user.about %}muted{% endif %}">
            {% if other_user.about %}{{ other_user.about }}{% else %}No bio added.{% endif %}
          </div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Message Button -->
    <a href="{% url 'chat_detail' other_user.id %}" class="msg-btn">
      <i class="fas fa-paper-plane"></i>
      Message {{ other_user.username }}
    </a>

    <!-- Back -->
    <a href="javascript:history.back()" class="back-link">
      <i class="fas fa-arrow-left" style="font-size:11px;"></i> Go back
    </a>

  </div>

</body>
</html>
